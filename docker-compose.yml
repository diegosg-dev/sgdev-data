services:
  web:
    build:
      context: .
      target: web
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Weekly ETL: fetch OpenRouter + LMArena, write SQLite + JSON.
  etl:
    build:
      context: .
      target: etl
    volumes:
      - ./data:/app/data
      - ./public/data:/app/public/data
    profiles: ["etl"]
    command: ["npm", "run", "etl"]
    restart: "no"

  etl-cron:
    build:
      context: .
      target: etl
    volumes:
      - ./data:/app/data
      - ./public/data:/app/public/data
    environment:
      - ETL_INTERVAL_SECONDS=604800
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "ETL cron container up. Running weekly snapshot every $${ETL_INTERVAL_SECONDS:-604800}s."
        while true; do
          npm run etl || echo "ETL run failed at $$(date -u)"
          sleep "$${ETL_INTERVAL_SECONDS:-604800}"
        done
    restart: unless-stopped
